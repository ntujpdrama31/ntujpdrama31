*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans",sans-serif;font-size:16px;line-height:1.6}main{max-width:650px;margin:auto;padding:56px 24px 32px}.masthead{display:flex;justify-content:space-between;gap:16px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line);font-size:14px;letter-spacing:.09em;color:var(--muted)}.mark{color:var(--accent);font-weight:700}header{padding:48px 0 40px}h1{font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(30px,6vw,46px);font-weight:600;line-height:1.65;letter-spacing:.045em;margin:0 0 20px}.title-line{display:block}.intro{margin:0;color:var(--muted);font-size:16px}section{margin-bottom:32px}h2{font-size:14px;font-weight:600;letter-spacing:.1em;color:var(--muted);margin:0 0 12px}.links{display:grid;gap:12px}a.card{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid var(--line);border-radius:8px;padding:16px 20px;background:var(--paper);color:var(--ink);text-decoration:none;transition:background .15s,border-color .15s,transform .15s}.name{display:block;font-size:19px;font-weight:600}.detail{display:block;color:var(--muted);font-size:14px;margin-top:2px}.arrow{font-size:24px;line-height:1;color:var(--accent)}a.card:hover{background:var(--soft);border-color:var(--accent);transform:translateY(-2px)}a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.primary{border-left:4px solid var(--accent)!important;padding-left:17px!important}footer{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:14px}.footer-title{margin:0;font-size:14px}.note{margin:4px 0 0}
@media(max-width:440px){main{padding-top:32px}header{padding:32px 0}h1{font-size:30px;letter-spacing:.015em}.masthead{letter-spacing:.04em}.card{padding:16px!important}.primary{padding-left:13px!important}}
@media(prefers-color-scheme:dark){:root{--bg:#191919;--paper:#222120;--ink:#f6f2eb;--muted:#c0b8ac;--line:#81786b;--accent:#eca28e;--soft:#35302b}meta[name="theme-color"]{color:#191919}}
@media(prefers-reduced-motion:reduce){a.card{transition:none}a.card:hover{transform:none}}
</style>
